# 神盾計畫（Project Aegis）階段一基準測試：C# 排班引擎（aegis/）必須與 Python 正式引擎逐次求解完全一致。
# 黃金樣本在同一台機器上現場產生（不進 git）：OR-Tools 原生程式庫因平台而異，同機產生 / 比對才有意義。
# 只在引擎相關檔案變動時跑（約 10–15 分鐘）。
name: Aegis baseline

on:
  push:
    branches: [main]
    paths: ['aegis/**', 'local_test/hybrid/model.py', 'cpsat_service.py', 'local_test/run_demo.py', 'aegis/baseline/requirements.lock', 'api/_lib/crypto.js', 'api/_lib/passwordHistory.js', '.github/workflows/aegis.yml']
  pull_request:
    branches: [main]
    paths: ['aegis/**', 'local_test/hybrid/model.py', 'cpsat_service.py', 'local_test/run_demo.py', 'aegis/baseline/requirements.lock', 'api/_lib/crypto.js', 'api/_lib/passwordHistory.js', '.github/workflows/aegis.yml']

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aegis/baseline/requirements.lock
      # 只裝預先編譯好的 wheel（不跑套件的安裝腳本）、所有版本與雜湊鎖定
      - run: 'pip install --only-binary :all: --require-hashes -r aegis/baseline/requirements.lock'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 欄位加密 / 密碼雜湊 Node ↔ C# 對照（階段二）
        working-directory: aegis
        run: dotnet test tests/Aegis.Security.Tests --logger "console;verbosity=normal"
      - name: 產生 Python 黃金樣本
        run: python -u aegis/baseline/make_golden.py
      - name: C# 引擎比對
        working-directory: aegis
        run: dotnet test tests/Aegis.Engine.Baseline --logger "console;verbosity=detailed"
