name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    env:
      # Firebase client config — required for the dev server to initialise auth.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # Test credentials — specs call test.skip() when these are absent.
      TEST_STAFF_ID: ${{ secrets.TEST_STAFF_ID }}
      TEST_STAFF_PW: ${{ secrets.TEST_STAFF_PW }}
      TEST_ADMIN_ID: ${{ secrets.TEST_ADMIN_ID }}
      TEST_ADMIN_PW: ${{ secrets.TEST_ADMIN_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  # 神盾計畫：同一套前端接地端後端（Aegis.Api + SQLite 示範資料）跑同一組 e2e，外加地端專屬的
  # 即時推送 / 同時編輯保護 / CP-SAT 背景排班（tests/e2e/aegis.spec.js）
  e2e-aegis:
    name: Playwright E2E（地端 Aegis）
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    env:
      VITE_BACKEND: aegis
      E2E_BACKEND: aegis
      # 示範資料的帳號（dotnet run -- --seed-demo 建立；不是正式帳密）
      AEGIS_DEMO_ADMIN_PW: Admin1234
      AEGIS_DEMO_STAFF_PW: Demo1234
      TEST_STAFF_ID: n004
      TEST_STAFF_PW: Demo1234
      TEST_ADMIN_ID: admin
      TEST_ADMIN_PW: Admin1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: 啟動 Aegis.Api（Development + 示範資料）
        working-directory: aegis/src/Aegis.Api
        run: |
          nohup dotnet run -- --seed-demo > "$RUNNER_TEMP/aegis-api.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:5080/health && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/aegis-api.log"; exit 1
      - name: Run Playwright tests（VITE_BACKEND=aegis）
        run: npm run test:e2e
      - name: Aegis.Api log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/aegis-api.log"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-aegis
          path: test-results/
          retention-days: 14
